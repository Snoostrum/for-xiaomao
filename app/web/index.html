<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>小灶</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>小灶</h1>
  <nav>
    <button class="tab active" data-tab="course">课件助手</button>
    <button class="tab" data-tab="download">下载管家</button>
    <button class="tab" data-tab="settings">设置</button>
  </nav>
</header>
<main>
  <section class="panel active" id="panel-course">
    <div class="row">
      <input type="file" id="course-file" accept=".pdf,application/pdf">
      <button id="btn-upload">放进课件库</button>
    </div>
    <p id="upload-result"></p>
    <ul id="course-list" class="course-list"></ul>
    <div id="ask-area" hidden>
      <h3 id="ask-title"></h3>
      <div class="row">
        <input id="ask-input" placeholder="比如:第 3 页讲的是什么?">
        <button id="btn-ask">提问</button>
      </div>
      <div id="ask-result"></div>
    </div>
    <p class="hint">放进来 → 点「解析」→ 解析就是把课件拆成一页一页存在本机;解析过的页不会重复解析。</p>
  </section>
  <section class="panel" id="panel-download">
    <p>下载管家还没接上——再下一个里程碑。</p>
  </section>
  <section class="panel" id="panel-settings">
    <label>平台
      <select id="provider"></select>
    </label>
    <label>接口地址
      <input id="base-url" placeholder="如 https://api.deepseek.com/v1(填平台的接口地址,不是网页地址)">
    </label>
    <label>模型名
      <input id="model" placeholder="例如 deepseek-flash">
    </label>
    <label>视觉模型(看扫描页用;留空 = 和上面模型相同)
      <input id="vision-model" placeholder="可不填">
    </label>
    <label>API Key
      <input id="api-key" type="password" placeholder="粘贴到这里(已存过就留空,表示不改)">
    </label>
    <div class="actions">
      <button id="btn-save">保存</button>
      <button id="btn-test">测试连接</button>
    </div>
    <p id="save-result"></p>
    <p id="test-result"></p>
    <p id="usage-line" class="hint"></p>
  </section>
</main>
<script type="module" src="/static/app.js"></script>
</body>
</html>
