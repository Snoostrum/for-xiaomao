name: build-windows
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest
      - name: 跑测试
        run: python -m pytest -q
      - name: 打包
        run: pyinstaller xiaozhao.spec --noconfirm
      - name: 冒烟(打包出的 exe 真跑一遍)
        run: .\dist\小灶.exe --self-test
      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: xiaozhao-windows
          path: dist/小灶.exe
